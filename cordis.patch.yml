# ============================================================================
# dsh-douyin-scroll —— DSH bundle patch（插件**自带**的挂载声明）
# ============================================================================
# 跟 dsh-bili-scroll 同一套规矩：包自己声明要往 profile 的配置树里插什么。
# 装上之后，profile 只要在 `dsh.profile.bundles` 里列出本包名即生效：
#
#   dsh plugin --profile web add dsh-douyin-scroll
#   （本地开发时用：dsh plugin --profile web add link:<你自己的插件目录>）
#
# 组成顺序：每个 bundle 的 patch 按 `dsh.profile.bundles` 顺序叠
#          → 再叠 profile 自己那一层的 cordis.patch.yml（只有那层是热重载）
# ============================================================================

- insert:
    - id: douyin-scroll          # ⭐ 必须等于命名空间名（设置页 volatile 写入的前提）
      name: dsh-douyin-scroll
      config:
        # 真正的用户配置在插件自己的 config 里（设置页可改），这里只放默认值
        enabled: true
